name: upstream-watch
on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays 01:00 UTC = 09:00 Asia/Taipei
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare the latest Liger release with our fork base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python tools/upstream_watch.py
